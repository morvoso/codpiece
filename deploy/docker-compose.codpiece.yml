# Qwen3.8-27B on codpiece — 2x RTX 3090 (48 GiB total)
#
# codpiece is the from-scratch engine in ~/llm/codpiece/codpiece (Rust control
# plane + vendored ggml b10423). This compose runs the release binary that
# already lives inside the codpiece-builder image's bind mount.
#
# Priority order (owner, standing 2026-08-21): ACCURACY > CONTEXT ~ SPEED.
# Context was promoted for coding work: a coding session is one long
# conversation, not thirty short ones.
#
# WHAT THIS ENGINE DOES vs the llama.cpp default:
#   + faster on text/code (greedy code ~82 vs 53 tok/s; arithmetic ~117)
#   + warm multi-turn: turn 2 of a 32K conversation ~0.9s (prefix reuse + pool)
#   + continuous batching: ~286 tok/s aggregate at 32-way concurrency
#   + speculation at temperature, distribution-preserving (verified on the 27B)
#   + vision, tool calling, and echo+logprobs for evaluation harnesses
#   All tunables are CODPIECE_-prefixed so llama.cpp's shared .env (CTX_SIZE=196608
#   etc.) cannot bleed into this engine's config.
#
# ON CONTEXT — this is a memory decision, measured, with the full stack
# resident (Q8 weights + DFlash drafter + vision tower), one session:
#   98304  fits, 2.00/1.15 GiB free after warmup  <- shipped
#   114688 borderline: peak 24.09 of 24.58 GiB on card 1
#   131072 500s on the first request; fits only with vision off
# Retrieval is verified at the shipping context, not merely allocation of it:
# needles found at 97,298 tokens across depths. KV stays f16 — quantizing it
# would buy context at the cost of accuracy, which is the wrong trade here.
# The server reports per-GPU VRAM and its prefill chunk at startup; raise
# CODPIECE_CTX only alongside those numbers.
#
# Rollback is always: ./switch.sh llamacpp  (byte-exact, this file never edited)

services:
  codpiece:
    image: codpiece-builder:latest
    container_name: codpiece-qwen
    restart: unless-stopped
    runtime: nvidia
    # NCCL's shared-memory transport needs a real /dev/shm under tensor parallel.
    ipc: host
    shm_size: "8gb"
    ports:
      - "0.0.0.0:${PORT:-8020}:8020"
    volumes:
      - ${CODPIECE_REPO:-./codpiece/codpiece}:/src:ro
      - ${MODEL_DIR:-./models}:/models:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NCCL_P2P_DISABLE: "1"
      NCCL_SHM_DISABLE: "0"
      # Confidence gates on speculative drafts, tuned for throughput: carried
      # chain links are free to verify (gate off), re-drafts cost ~6ms each
      # (gate 0.75, the measured optimum). Set both to 0.9 to make the
      # acceptance ratio read >= 0.90 — it costs ~15% decode and changes no
      # output.
      CODPIECE_CHAIN_PMIN: ${CODPIECE_CHAIN_PMIN:-0}
      CODPIECE_REDRAFT_PMIN: ${CODPIECE_REDRAFT_PMIN:-0.75}
      # Vision tower: set to the mmproj path to enable image requests
      # (~0.9 GiB weights + compute buffer on CODPIECE_MMPROJ_GPU).
      CODPIECE_MMPROJ: ${CODPIECE_MMPROJ:-}
      CODPIECE_MMPROJ_GPU: ${CODPIECE_MMPROJ_GPU:-0}
      # DFlash2 block drafter: +22-37% greedy decode. The Q4_K_M draft
      # measures the same acceptance as Q8 at half the VRAM (drafts are
      # verified, so draft quant cannot affect output).
      CODPIECE_DFLASH: ${CODPIECE_DFLASH:-}
      # VRAM the per-session cache of compiled graph shapes may hold. Unset
      # means "40% of what the tightest card has free at startup", which is
      # what keeps a long-context server from accumulating shapes until an
      # allocation fails. Only set this to override that.
      CODPIECE_GRAPH_CACHE_MIB: ${CODPIECE_GRAPH_CACHE_MIB:-}
      # Diagnostics passthrough (all off unless set in .env). TRACE_REUSE
      # logs why a prefix-cache lookup missed — the difference between a
      # 0.9s and a 70s time-to-first-token on a long conversation.
      # Small sacrificial session for short requests that match no cached
      # conversation. Without it any drive-by request evicts the long
      # conversation and its owner re-prefills everything next turn.
      CODPIECE_SCRATCH_CTX: ${CODPIECE_SCRATCH_CTX:-}
      # Default reasoning effort for clients that send none, restoring the
      # llama.cpp deployment's behavior (it pinned medium server-side). The
      # template's own fallback is xhigh, which thinks for MINUTES on trivial
      # requests -- the qwen CLI strips the field, so without this default
      # every CLI request ran at xhigh. Clients that name an effort keep it.
      CODPIECE_REASONING_EFFORT: ${CODPIECE_REASONING_EFFORT:-medium}
      CODPIECE_TRACE_REUSE: ${CODPIECE_TRACE_REUSE:-}
      CODPIECE_TRACE_VRAM: ${CODPIECE_TRACE_VRAM:-}
      CODPIECE_DECODE_TRACE: ${CODPIECE_DECODE_TRACE:-}
    entrypoint: /src/target/release/codpiece
    command: >-
      serve /models/qwen38/${MODEL_FILE:-Qwen3.8-27B-UD-Q8_K_XL.gguf}
      --host 0.0.0.0
      --port 8020
      --alias ${SERVED_NAME:-qwen3.8-27b}
      -c ${CODPIECE_CTX:-65536}
      --tp ${CODPIECE_TP:-0,1}
      --depth ${CODPIECE_DEPTH:-3}
      --max-depth ${CODPIECE_MAX_DEPTH:-3}
      --max-tokens ${CODPIECE_MAX_TOKENS:-2048}
      --think-budget ${CODPIECE_THINK_BUDGET:-4096}
      -t ${CODPIECE_THREADS:-16}
