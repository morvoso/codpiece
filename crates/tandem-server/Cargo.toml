[package]
name = "tandem-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tandem-gguf = { path = "../tandem-gguf" }
tandem-tok = { path = "../tandem-tok" }
tandem-model = { path = "../tandem-model" }
tandem-sample = { path = "../tandem-sample" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", features = ["loader", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[features]
cuda = ["tandem-model/cuda"]
