[package]
name = "codpiece-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
codpiece-gguf = { path = "../codpiece-gguf" }
codpiece-tok = { path = "../codpiece-tok" }
codpiece-model = { path = "../codpiece-model" }
codpiece-sample = { path = "../codpiece-sample" }
codpiece-vision = { path = "../codpiece-vision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `json` supplies the tojson filter, which this template uses to render every
# non-string tool-call argument; without it any tool-call turn fails to render.
minijinja = { version = "2", features = ["loader", "builtins", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[features]
cuda = ["codpiece-model/cuda", "codpiece-vision/cuda"]
